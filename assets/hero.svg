<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Piano, staff, and a rising melody in a Castle Rock lesson room</title>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a334c"/>
      <stop offset="1" stop-color="#151c2d"/>
    </linearGradient>
    <linearGradient id="lamp" x1="0.7" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f0d48a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f0d48a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f0e2"/>
      <stop offset="1" stop-color="#eadfc8"/>
    </linearGradient>
    <linearGradient id="cedar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4e2c1d"/>
      <stop offset="1" stop-color="#7a4a30"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" fill="url(#room)"/>
  <ellipse cx="640" cy="70" rx="210" ry="130" fill="url(#lamp)"/>
  <circle cx="668" cy="52" r="18" fill="#e0c47a"/>
  <path d="M660 70 l16 0 10 36 -36 0 z" fill="#c9a35a" opacity="0.85"/>
  <!-- window dusk -->
  <rect x="48" y="36" width="150" height="110" rx="4" fill="#1a2338" stroke="#c9a35a" stroke-width="3"/>
  <path d="M48 91h150M123 36v110" stroke="#c9a35a" stroke-width="2" opacity="0.6"/>
  <circle cx="168" cy="58" r="10" fill="#e0c47a" opacity="0.35"/>
  <!-- music desk -->
  <rect x="86" y="168" width="628" height="248" rx="8" fill="url(#paper)" stroke="#6d3f2a" stroke-width="6"/>
  <rect x="86" y="168" width="22" height="248" fill="url(#cedar)"/>
  <!-- staff -->
  <g stroke="#1a2338" stroke-opacity="0.28" stroke-width="1.6" fill="none">
    <path d="M140 232h530"/>
    <path d="M140 254h530"/>
    <path d="M140 276h530"/>
    <path d="M140 298h530"/>
    <path d="M140 320h530"/>
  </g>
  <!-- treble clef -->
  <path fill="#1a2338" d="M186 198c18-4 36 10 34 30-1 15-14 22-24 30 13 2 23 11 23 24 0 18-19 29-36 24-9-2-15-10-15-19 1-8 7-13 15-13 6 0 11 5 10 11 0 4-3 7-7 7-2 0-3-1-4-2 2 6 9 10 17 9 12-1 20-10 20-21 0-12-10-19-23-21l-4-1 2-3c10-14 20-20 22-32 1-13-10-23-24-21-12 2-19 13-18 24 0 4 1 7 3 9-5-4-8-10-8-17 0-15 12-26 27-29z"/>
  <circle cx="172" cy="348" r="10" fill="#1a2338"/>
  <path d="M182 348 V228" stroke="#1a2338" stroke-width="3.2"/>
  <!-- rising melody -->
  <path d="M250 310 C 310 310, 330 276, 380 276 S 450 248, 510 248 580 220, 640 214" fill="none" stroke="#6d3f2a" stroke-width="2.4" stroke-linecap="round"/>
  <g fill="#1a2338">
    <ellipse cx="268" cy="310" rx="11" ry="8" transform="rotate(-18 268 310)"/>
    <path d="M278 307 V246" stroke="#1a2338" stroke-width="2.4"/>
    <ellipse cx="380" cy="276" rx="11" ry="8" transform="rotate(-18 380 276)"/>
    <path d="M390 273 V214" stroke="#1a2338" stroke-width="2.4"/>
    <ellipse cx="510" cy="248" rx="11" ry="8" transform="rotate(-18 510 248)"/>
    <path d="M520 245 V188" stroke="#1a2338" stroke-width="2.4"/>
    <ellipse cx="640" cy="214" rx="11" ry="8" transform="rotate(-18 640 214)"/>
    <path d="M650 211 V156" stroke="#1a2338" stroke-width="2.4"/>
  </g>
  <!-- small heart as last note head accent -->
  <path fill="#6d3f2a" d="M662 150 c4-6 12-6 14 0 2 6-7 12-14 16-7-4-16-10-14-16 2-6 10-6 14 0z"/>
  <!-- voice breath arc -->
  <path d="M240 198 c40-28 90-28 130 0" fill="none" stroke="#c9a35a" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M250 188 c32-18 72-18 104 0" fill="none" stroke="#c9a35a" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <!-- piano -->
  <g>
    <rect x="40" y="430" width="720" height="70" fill="#f7f0e2" stroke="#1a2338" stroke-width="3"/>
    <g fill="#f7f0e2" stroke="#1a2338" stroke-width="1.4">
      <rect x="40" y="430" width="48" height="70"/>
      <rect x="88" y="430" width="48" height="70"/>
      <rect x="136" y="430" width="48" height="70"/>
      <rect x="184" y="430" width="48" height="70"/>
      <rect x="232" y="430" width="48" height="70"/>
      <rect x="280" y="430" width="48" height="70"/>
      <rect x="328" y="430" width="48" height="70"/>
      <rect x="376" y="430" width="48" height="70"/>
      <rect x="424" y="430" width="48" height="70"/>
      <rect x="472" y="430" width="48" height="70"/>
      <rect x="520" y="430" width="48" height="70"/>
      <rect x="568" y="430" width="48" height="70"/>
      <rect x="616" y="430" width="48" height="70"/>
      <rect x="664" y="430" width="48" height="70"/>
      <rect x="712" y="430" width="48" height="70"/>
    </g>
    <g fill="#1a2338">
      <rect x="74" y="430" width="28" height="42"/>
      <rect x="122" y="430" width="28" height="42"/>
      <rect x="218" y="430" width="28" height="42"/>
      <rect x="266" y="430" width="28" height="42"/>
      <rect x="314" y="430" width="28" height="42"/>
      <rect x="410" y="430" width="28" height="42"/>
      <rect x="458" y="430" width="28" height="42"/>
      <rect x="554" y="430" width="28" height="42"/>
      <rect x="602" y="430" width="28" height="42"/>
      <rect x="650" y="430" width="28" height="42"/>
    </g>
  </g>
</svg>
